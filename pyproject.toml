[project]
name = "concurrent-web-fetcher"
version = "0.1.0"
description = "Fetch many pages at once, retry failures, respect robots.txt and save clean JSONL."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
 "httpx==0.28.1",
 "typer==0.27.3",
 "rich==15.0.0",
 "beautifulsoup4==4.15.0",
 "pydantic==2.14.1",
]

[project.scripts]
fetcher = "fetcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetcher"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]
